name: Build, test and release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Build and test both browsers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate release tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run version:check -- "$RELEASE_TAG"
      - run: npx playwright install --with-deps chromium firefox
      - run: npm test
      - run: npm run lint:firefox
      - run: npm run package:source
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: extension-packages
          path: artifacts/unqlock-*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: extension-packages
          path: artifacts
      - name: Create release with tested packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/unqlock-*.zip \
            --verify-tag --title "Unqlock $RELEASE_TAG" --generate-notes \
            --notes "Chrome ZIP: extract and load unpacked. Firefox ZIP: unsigned; temporary installation only until Mozilla signing. Source ZIP included."
