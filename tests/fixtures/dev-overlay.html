<!doctype html>
<meta charset="utf-8">
<title>Dev overlay fixture</title>
<!-- Unqork's dev overlay as captured from a saved builder page: the toolbar with Expand dev overlay, and the
     fixed bottom drawer with its drag handle, a header row spreading the tool selector and Minimize dev
     overlay apart, and the SSE Debugger with its Run as select, whose list is portaled to <body> like Base
     UI's. Minimizing slides the drawer away and marks it aria-hidden. The drawer's state, the workspace tabs
     and the debugger identity persist under Unqork's keys, the tabs again on pagehide. -->
<style>
  body { margin:0; height:100vh; background:#fff; }
  header { height:48px; }
  [data-testid="dev-overlay"] { position:fixed; left:0; right:0; bottom:0; z-index:55; display:flex; flex-direction:column; background:#fff; border-top:1px solid #ccc; }
  [data-testid="dev-overlay"][aria-hidden="true"] { transform:translateY(100%); }
  [data-testid="dev-overlay-drag-handle"] { height:1px; cursor:row-resize; }
  #overlay-header { display:flex; align-items:center; justify-content:space-between; padding:6px 16px; }
  #overlay-header button { height:28px; }
  #overlay-header svg { width:16px; height:16px; }
  [data-testid="debugger"] { flex:1; padding:16px; }
  [role="listbox"] { position:fixed; z-index:60; background:#fff; border:1px solid #ccc; }
</style>
<header><span>unqork</span></header>
<main><h1 id="heading">Canvas</h1></main>
<div data-testid="dev-overlay-toolbar"><button type="button" aria-label="Expand dev overlay" id="expand">Debugger</button></div>
<div data-testid="dev-overlay" aria-hidden="false">
  <div data-testid="dev-overlay-drag-handle"></div>
  <div id="overlay-header"></div>
  <div data-testid="debugger"><span>Run as</span> <button type="button" role="combobox" aria-label="Run as" id="run-as">Administrator</button></div>
</div>
<script>
  const overlay = document.querySelector('[data-testid="dev-overlay"]');
  const saved = JSON.parse(localStorage.getItem('ide-dev-overlay') || 'null');
  const state = { open:saved ? saved.open : true, height:saved?.height || 400 };
  const persist = () => localStorage.setItem('ide-dev-overlay', JSON.stringify(state));
  const render = () => {
    overlay.setAttribute('aria-hidden', String(!state.open));
    overlay.style.height = state.height + 'px';
  };
  // React re-renders the header row, dropping anything it did not create.
  window.rerenderHeader = () => {
    document.getElementById('overlay-header').innerHTML = '<button type="button" role="combobox" data-slot="select-trigger">Debugger</button>'
      + '<button type="button" aria-label="Minimize dev overlay" class="minimize"><svg class="lucide size-4" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>';
    document.querySelector('[aria-label="Minimize dev overlay"]').addEventListener('click', () => { state.open = false; persist(); render(); });
  };
  document.getElementById('expand').addEventListener('click', () => { state.open = true; persist(); render(); });
  document.getElementById('run-as').addEventListener('click', event => {
    const rect = event.currentTarget.getBoundingClientRect();
    const list = document.createElement('div');
    list.setAttribute('role', 'listbox');
    list.style.top = rect.bottom + 'px';
    list.style.left = rect.left + 'px';
    list.innerHTML = '<div role="option">Viewer</div>';
    list.firstChild.addEventListener('click', () => {
      document.getElementById('run-as').textContent = 'Viewer';
      localStorage.setItem('ide-sse-debugger-identity', JSON.stringify({ state:{ designerAssumeRole:'Viewer' } }));
      list.remove();
    });
    document.body.append(list);
  });
  window.saveTabs = tabs => localStorage.setItem('ide-workspace-store', JSON.stringify({ tabs }));
  addEventListener('pagehide', () => window.saveTabs([location.pathname]));
  rerenderHeader();
  render();
</script>
